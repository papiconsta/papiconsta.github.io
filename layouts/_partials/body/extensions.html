<script>
(function () {
  var toc = document.querySelector(".page-toc");
  if (!toc || !("IntersectionObserver" in window)) return;

  var links = toc.querySelectorAll("a[href^='#']");
  if (!links.length) return;

  var linkByID = {};
  links.forEach(function (link) {
    linkByID[decodeURIComponent(link.getAttribute("href").slice(1))] = link;
  });

  var setActive = function (id) {
    links.forEach(function (link) { link.classList.remove("is-active"); });
    var active = linkByID[id];
    if (active) active.classList.add("is-active");
  };

  var observer = new IntersectionObserver(
    function (entries) {
      var visible = entries
        .filter(function (entry) { return entry.isIntersecting; })
        .sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
      if (visible.length) setActive(visible[0].target.id);
    },
    { rootMargin: "-10% 0px -80% 0px", threshold: 0 }
  );

  Object.keys(linkByID).forEach(function (id) {
    var heading = document.getElementById(id);
    if (heading) observer.observe(heading);
  });
})();

(function () {
  var triggers = document.querySelectorAll("a.pdf-viewer-link");
  if (!triggers.length) return;

  var overlay = document.createElement("div");
  overlay.className = "pdf-modal-overlay";
  overlay.innerHTML =
    '<div class="pdf-modal" role="dialog" aria-modal="true">' +
    '<div class="pdf-modal__header">' +
    '<button type="button" class="pdf-modal__close" aria-label="Close">&times;</button>' +
    "</div>" +
    '<iframe class="pdf-modal__frame"></iframe>' +
    "</div>";
  document.body.appendChild(overlay);

  var frame = overlay.querySelector(".pdf-modal__frame");
  var closeBtn = overlay.querySelector(".pdf-modal__close");

  var closeModal = function () {
    overlay.classList.remove("is-open");
    frame.src = "";
  };

  var openModal = function (href) {
    frame.src = href;
    overlay.classList.add("is-open");
  };

  triggers.forEach(function (trigger) {
    trigger.addEventListener("click", function (event) {
      event.preventDefault();
      openModal(trigger.getAttribute("href"));
    });
  });

  closeBtn.addEventListener("click", closeModal);
  overlay.addEventListener("click", function (event) {
    if (event.target === overlay) closeModal();
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && overlay.classList.contains("is-open")) closeModal();
  });
})();
</script>
